# Versión final (con HTTPS). Usar solo cuando el certificado ya existe.
# Va en ~/yaghanhostel/docker/nginx/sloggett.conf  (reemplazar DOMINIO)
server {
    listen 80;
    server_name DOMINIO www.DOMINIO;

    location /.well-known/acme-challenge/ {
        root /certbot;
    }
    location / {
        return 301 https://DOMINIO$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name www.DOMINIO;
    ssl_certificate     /etc/letsencrypt/live/DOMINIO/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/DOMINIO/privkey.pem;
    return 301 https://DOMINIO$request_uri;
}

server {
    listen 443 ssl;
    server_name DOMINIO;

    ssl_certificate     /etc/letsencrypt/live/DOMINIO/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/DOMINIO/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    client_max_body_size 5m;

    location / {
        # Resolver de Docker + variable: nginx arranca aunque sloggett-web esté caído.
        resolver 127.0.0.11 valid=30s;
        set $sloggett http://sloggett-web:3000;
        proxy_pass $sloggett;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }
}
